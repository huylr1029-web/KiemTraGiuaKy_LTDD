name: le_thanh_huy_0827
description: "App cham cong cho nhan vien - LTDD Tuan 6 + Tuan 7 mo rong (Identity/JWT + CRUD)."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Tuan 7 (goc): JWT decode + dotenv + SharedPreferences + http
  http: ^1.2.0
  jwt_decoder: ^2.0.1
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  # Cham cong chong gian lan: GPS + WiFi
  geolocator: ^12.0.0
  network_info_plus: ^6.0.0
  # Face login / face check-in: chup anh + nhan dien khuon mat
  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.10.0
  google_mlkit_text_recognition: ^0.13.0
  # Dich realtime: noi + anh
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  translator: ^1.0.0
  # OAuth2.0 ben thu 3: mo trinh duyet he thong, bat callback scheme
  flutter_web_auth_2: ^4.1.0
  # Video nhom: phong Jitsi (khong can key, chay that)
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - .env
